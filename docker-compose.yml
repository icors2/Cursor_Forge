# Local first-slice stack: Postgres + Nest API + Next.js web.
# Copy .env.example to .env and fill names. Do not commit .env.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # pragma: allowlist secret
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - volleyball_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-server:
    build:
      context: .
      dockerfile: docker/api-server.Dockerfile
    ports:
      - "4010:4010"
    environment:
      PORT: "4010"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB} # pragma: allowlist secret
      JWT_SECRET: ${JWT_SECRET} # pragma: allowlist secret
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:3010,http://localhost:3010}
    depends_on:
      postgres:
        condition: service_healthy

  web-client:
    build:
      context: .
      dockerfile: docker/web-client.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3010:3010"
    environment:
      PORT: "3010"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - api-server

volumes:
  volleyball_pg:
